{% extends 'base.html' %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden glass">
        <div class="bg-secondary p-8 text-center text-white relative overflow-hidden">
            <div class="absolute top-0 right-0 -mt-10 -mr-10 w-40 h-40 bg-primary rounded-full opacity-50 blur-3xl"></div>
            <div class="absolute bottom-0 left-0 -mb-10 -ml-10 w-40 h-40 bg-blue-500 rounded-full opacity-50 blur-3xl"></div>
            <div class="relative z-10 flex flex-col items-center">
                <i data-lucide="store" class="w-16 h-16 mb-4 text-primary"></i>
                <h2 class="text-3xl font-bold tracking-tight">SwiftPOS</h2>
                <p class="text-gray-300 mt-2">Sign in to your account</p>
            </div>
        </div>
        <div class="p-8">
            <form method="POST" action="{{ url_for('login') }}" class="space-y-6">
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i data-lucide="user" class="text-gray-400 w-5 h-5"></i>
                        </div>
                        <input type="text" name="username" id="username" required
                            class="pl-10 w-full rounded-lg border-gray-300 bg-gray-50 border focus:border-primary focus:ring-2 focus:ring-primary/20 py-2.5 transition-all"
                            placeholder="admin">
                    </div>
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i data-lucide="lock" class="text-gray-400 w-5 h-5"></i>
                        </div>
                        <input type="password" name="password" id="password" required
                            class="pl-10 w-full rounded-lg border-gray-300 bg-gray-50 border focus:border-primary focus:ring-2 focus:ring-primary/20 py-2.5 transition-all"
                            placeholder="••••••••">
                    </div>
                </div>
                <div class="flex items-center justify-between">
                    <div class="flex items-center">
                        <input id="remember_me" name="remember_me" type="checkbox"
                            class="h-4 w-4 text-primary focus:ring-primary border-gray-300 rounded">
                        <label for="remember_me" class="ml-2 block text-sm text-gray-700">
                            Remember me
                        </label>
                    </div>
                    <div class="text-sm">
                        <a href="{{ url_for('forgot_password') }}" class="font-medium text-primary hover:text-indigo-700">
                            Forgot password?
                        </a>
                    </div>
                </div>
                <button type="submit"
                    class="w-full flex justify-center items-center gap-2 py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-primary hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all duration-300 transform hover:scale-[1.02]">
                    <i data-lucide="log-in" class="w-4 h-4"></i> Sign In
                </button>
            </form>
            <div class="mt-6 text-center text-sm text-gray-500">
                Default admin login: <span class="font-semibold text-gray-700">admin / admin123</span>
            </div>
        </div>
    </div>
</div>
{% endblock %}
