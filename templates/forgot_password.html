{% extends 'base.html' %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center py-6 bg-slate-50/50">
    <div class="max-w-md w-full bg-white rounded-3xl shadow-xl overflow-hidden border border-gray-150 glass">
        
        <!-- Header -->
        <div class="bg-secondary p-8 text-center text-white relative overflow-hidden">
            <div class="absolute top-0 right-0 -mt-10 -mr-10 w-40 h-40 bg-primary rounded-full opacity-30 blur-3xl"></div>
            <div class="absolute bottom-0 left-0 -mb-10 -ml-10 w-40 h-40 bg-blue-500 rounded-full opacity-30 blur-3xl"></div>
            <div class="relative z-10 flex flex-col items-center">
                <div class="w-16 h-16 bg-white/10 rounded-3xl flex items-center justify-center mb-4">
                    <i data-lucide="help-circle" class="w-10 h-10 text-primary"></i>
                </div>
                <h2 class="text-2xl font-black tracking-tight text-white">Reset Password</h2>
                <p class="text-xs text-gray-300 mt-1.5">Recover account with Store Security PIN</p>
            </div>
        </div>

        <!-- Body -->
        <div class="p-8">
            <form method="POST" action="{{ url_for('forgot_password') }}" class="space-y-5">
                
                <!-- Username -->
                <div>
                    <label for="username" class="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-1.5">Your Username</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
                            <i data-lucide="user" class="w-4 h-4"></i>
                        </div>
                        <input type="text" name="username" id="username" required
                            class="pl-10 w-full rounded-xl border-gray-205 bg-gray-50 border focus:border-primary focus:bg-white focus:ring-2 focus:ring-primary/20 py-2.5 text-xs font-semibold transition-all text-gray-800"
                            placeholder="admin or cashier">
                    </div>
                </div>

                <!-- Recovery PIN -->
                <div>
                    <label for="recovery_pin" class="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-1.5">Store Recovery PIN</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
                            <i data-lucide="key" class="w-4 h-4"></i>
                        </div>
                        <input type="password" name="recovery_pin" id="recovery_pin" required
                            class="pl-10 w-full rounded-xl border-gray-205 bg-gray-50 border focus:border-primary focus:bg-white focus:ring-2 focus:ring-primary/20 py-2.5 text-xs font-semibold transition-all text-gray-800"
                            placeholder="Default is 9999">
                    </div>
                    <p class="text-[10px] text-gray-400 mt-1">Contact your Administrator if you forgot the Store PIN.</p>
                </div>

                <!-- New Password -->
                <div>
                    <label for="new_password" class="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-1.5">New Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
                            <i data-lucide="shield-check" class="w-4 h-4"></i>
                        </div>
                        <input type="password" name="new_password" id="new_password" required
                            class="pl-10 w-full rounded-xl border-gray-205 bg-gray-50 border focus:border-primary focus:bg-white focus:ring-2 focus:ring-primary/20 py-2.5 text-xs font-semibold transition-all text-gray-800"
                            placeholder="Min 6 characters">
                    </div>
                </div>

                <!-- Confirm Password -->
                <div>
                    <label for="confirm_password" class="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-1.5">Confirm New Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
                            <i data-lucide="shield-alert" class="w-4 h-4"></i>
                        </div>
                        <input type="password" name="confirm_password" id="confirm_password" required
                            class="pl-10 w-full rounded-xl border-gray-250 bg-gray-50 border focus:border-primary focus:bg-white focus:ring-2 focus:ring-primary/20 py-2.5 text-xs font-semibold transition-all text-gray-800"
                            placeholder="Re-enter new password">
                    </div>
                </div>

                <!-- Actions -->
                <div class="flex gap-3 pt-2">
                    <a href="{{ url_for('login') }}" class="flex-1 py-3 px-4 rounded-xl border border-gray-300 bg-white text-gray-700 text-xs font-bold text-center hover:bg-gray-55 transition-colors">
                        Cancel
                    </a>
                    <button type="submit" class="flex-1 py-3 px-4 rounded-xl shadow-lg shadow-indigo-500/20 text-white text-xs font-bold bg-primary hover:bg-indigo-600 transition-all flex items-center justify-center gap-1.5">
                        <i data-lucide="lock" class="w-4 h-4"></i> Reset Password
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
