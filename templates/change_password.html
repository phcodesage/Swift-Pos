{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto min-h-[70vh] flex flex-col justify-center py-6">
    <div class="bg-white rounded-3xl shadow-xl border border-gray-100 overflow-hidden">
        
        <!-- Header -->
        <div class="p-6 bg-secondary text-white text-center relative overflow-hidden">
            <div class="absolute top-0 right-0 -mt-10 -mr-10 w-32 h-32 bg-primary rounded-full opacity-30 blur-2xl"></div>
            <div class="relative z-10 flex flex-col items-center">
                <div class="w-12 h-12 bg-white/10 rounded-2xl flex items-center justify-center mb-3">
                    <i data-lucide="key" class="w-6 h-6 text-primary"></i>
                </div>
                <h2 class="text-xl font-bold tracking-tight">Change Password</h2>
                <p class="text-xs text-gray-300 mt-1">Update your account security credentials</p>
            </div>
        </div>

        <!-- Form -->
        <div class="p-6 sm:p-8">
            <form method="POST" action="{{ url_for('change_password') }}" class="space-y-5">
                
                <!-- Current Password -->
                <div>
                    <label for="current_password" class="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-1.5">Current Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
                            <i data-lucide="lock" class="w-4 h-4"></i>
                        </div>
                        <input type="password" name="current_password" id="current_password" required
                            class="pl-10 w-full rounded-xl border-gray-200 bg-gray-50/50 border focus:border-primary focus:bg-white focus:ring-2 focus:ring-primary/20 py-2.5 text-xs font-semibold transition-all"
                            placeholder="••••••••">
                    </div>
                </div>

                <!-- New Password -->
                <div>
                    <label for="new_password" class="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-1.5">New Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
                            <i data-lucide="shield-check" class="w-4 h-4"></i>
                        </div>
                        <input type="password" name="new_password" id="new_password" required
                            class="pl-10 w-full rounded-xl border-gray-200 bg-gray-50/50 border focus:border-primary focus:bg-white focus:ring-2 focus:ring-primary/20 py-2.5 text-xs font-semibold transition-all"
                            placeholder="Min 6 characters">
                    </div>
                </div>

                <!-- Confirm New Password -->
                <div>
                    <label for="confirm_password" class="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-1.5">Confirm New Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
                            <i data-lucide="shield-alert" class="w-4 h-4"></i>
                        </div>
                        <input type="password" name="confirm_password" id="confirm_password" required
                            class="pl-10 w-full rounded-xl border-gray-200 bg-gray-50/50 border focus:border-primary focus:bg-white focus:ring-2 focus:ring-primary/20 py-2.5 text-xs font-semibold transition-all"
                            placeholder="Re-type new password">
                    </div>
                </div>

                <!-- Actions -->
                <div class="flex gap-3 pt-2">
                    <a href="javascript:history.back()" onclick="playAudio('click')" class="flex-1 py-3 px-4 rounded-xl border border-gray-300 bg-white text-gray-700 text-xs font-bold text-center hover:bg-gray-50 transition-colors">
                        Go Back
                    </a>
                    <button type="submit" onclick="playAudio('click')" class="flex-1 py-3 px-4 rounded-xl shadow-lg shadow-indigo-500/20 text-white text-xs font-bold bg-primary hover:bg-indigo-600 transition-all flex items-center justify-center gap-1.5">
                        <i data-lucide="check" class="w-4 h-4"></i> Save Password
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
